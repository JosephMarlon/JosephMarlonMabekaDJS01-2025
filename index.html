<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast Previews</title>
    <meta name="description" content="Browse and discover top podcast shows.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="app-header">
        <div class="container">
            <h1>Podcast Discover</h1>
            <p>Find your next favorite show.</p>
        </div>
    </header>

    <main class="container">
        <!-- Podcast Previews will be rendered here -->
        <div id="podcast-grid" class="podcast-grid" aria-live="polite"></div>
    </main>

    <!-- Modal for Show Details -->
    <dialog id="podcast-modal" class="modal">
        <div class="modal-content">
            <button id="close-modal" class="close-btn" aria-label="Close modal">&times;</button>
            <div id="modal-body" class="modal-body">
                <!-- Dynamic content injected here -->
            </div>
        </div>
    </dialog>

    <script type="module" src="js/app.js"></script>
</body>
</html>
